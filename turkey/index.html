<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Find the Turkey · Kai's Kool Kwiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦃%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Fredoka", "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", Arial, sans-serif;
    color: #3a2a5d;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overflow: hidden;
    background: #3d2430;
  }
  button { font-family: inherit; cursor: pointer; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 95; width: 100%; height: 100%; }

  /* ===== Desk ===== */
  #desk {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    background:
      radial-gradient(ellipse at 50% 120%, rgba(255,186,80,.28), transparent 50%),
      linear-gradient(180deg, #6e3a48 0 38%, #8a5a32 38% 40.4%, #c9a36c 40.4% 100%);
    overflow: hidden;
  }
  .wall-leaf { position: absolute; font-size: 34px; opacity: .7; pointer-events: none; z-index: 0; }
  .topline {
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: center; z-index: 40;
    pointer-events: none;
  }
  .topline > * { pointer-events: auto; }
  .pill { display: inline-block; text-decoration: none; font-weight: 700; font-size: 18px; color: #7b5cff; background: #fff; border: 4px solid #fff; border-radius: 18px; padding: 7px 12px; box-shadow: 0 5px 0 #d4c8ff; }
  .pill:active { transform: translateY(4px); box-shadow: 0 1px 0 #d4c8ff; }
  .roundbtn { font-size: 24px; width: 50px; height: 50px; border-radius: 50%; border: 4px solid #fff; background: #ffe066; box-shadow: 0 4px 0 #d4a900; flex: none; padding: 0; line-height: 1; }
  .roundbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d4a900; }

  /* ===== Book stage ===== */
  #bookStage {
    position: relative;
    z-index: 2;
    perspective: 2200px;
    perspective-origin: 50% 48%;
    display: flex; align-items: center; justify-content: center;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
  }
  #book {
    --cw: min(400px, 86vw);
    --ch: min(580px, 74vh);
    position: relative;
    width: var(--cw);
    height: var(--ch);
    transform-style: preserve-3d;
    transition: width .9s cubic-bezier(.2,.7,.2,1), height .9s cubic-bezier(.2,.7,.2,1);
    flex: none;
  }
  #book.open {
    --sw: min(1120px, 96vw);
    --sh: min(720px, 86vh);
    width: var(--sw);
    height: var(--sh);
  }
  #book.single.open {
    width: min(520px, 94vw);
    height: min(calc(min(520px, 94vw) / 1.32 + 78px), 88vh);
  }
  .book-shadow {
    position: absolute; left: 6%; right: 6%; bottom: -22px; height: 30px;
    background: rgba(40,18,8,.4); filter: blur(14px); border-radius: 50%; z-index: 0; pointer-events: none;
  }
  .page-edge {
    position: absolute; top: 10px; bottom: 10px; width: 11px; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(90deg, #f3e2bf 0 2px, #e6d0a4 2px 3px, #f7ead0 3px 5px);
    border-radius: 0 3px 3px 0;
    box-shadow: 2px 0 0 #d4bc8a;
  }
  .page-edge.right-edge { right: -9px; }
  #book.closed .page-edge.right-edge { right: -12px; width: 14px; }
  #book.single.open .page-edge.right-edge { right: -8px; }

  .spread {
    position: absolute; inset: 0;
    display: flex; transform-style: preserve-3d;
    border-radius: 4px 10px 10px 4px;
    overflow: visible;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }
  #book.open .spread { opacity: 1; pointer-events: auto; }

  .page {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.45), transparent 55%),
      repeating-linear-gradient(0deg, rgba(120,70,20,.035) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, #f7ead0, #f0dcb6);
    color: #3a2414;
    position: relative;
    overflow: hidden;
  }
  .page.left, .cover-inside {
    width: 50%; height: 100%;
    border-radius: 3px 0 0 3px;
    box-shadow: inset -18px 0 28px -18px rgba(80,40,10,.22);
    padding: 16px 18px 16px 22px;
  }
  .page.right {
    width: 50%; height: 100%;
    border-radius: 0 8px 8px 0;
    box-shadow: inset 18px 0 28px -18px rgba(80,40,10,.18);
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  #book.single.open .page.right { width: 100%; border-radius: 0 8px 8px 0; }
  .spine {
    width: 16px; flex: none; height: 100%;
    background: linear-gradient(90deg, #5a121c, #8c1c2b 40%, #5a121c 70%, #3d0c14);
    box-shadow: inset 0 0 8px rgba(0,0,0,.45);
    z-index: 4;
  }
  #book.single.open .spine { width: 12px; }

  /* Cover: sits on the right half, hinged at the spine */
  .cover {
    position: absolute; top: 0; bottom: 0; right: 0;
    width: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    z-index: 20;
    border-radius: 4px 10px 10px 4px;
    transition: transform 1.05s cubic-bezier(.15,.62,.2,1), width .9s cubic-bezier(.2,.7,.2,1);
  }
  #book.open .cover { width: 50%; transform: rotateY(-180deg); pointer-events: none; }
  #book.single.open .cover { width: 100%; transform: rotateY(-180deg); pointer-events: none; }
  #book.opened .cover { z-index: 1; }
  .cover-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: inherit;
  }
  .cover-front {
    background:
      radial-gradient(ellipse at 50% 30%, #b42a3d, #7a1422 55%, #5a0e18);
    border: 8px solid #c9a24a;
    box-shadow:
      inset 0 0 0 4px #7a1422,
      inset 0 0 0 8px #e6c15a,
      0 8px 18px rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 16px 14px 18px;
    color: #f8e7b0;
    overflow: hidden;
  }
  .cover-front .brand { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #e6c15a; margin-top: 4px; }
  .cover-front h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 800; font-size: clamp(34px, 8vw, 52px);
    line-height: .95; text-align: center; margin: 8px 0 4px;
    color: #fff6d4; text-shadow: 0 2px 0 #5a0e18, 0 4px 0 rgba(0,0,0,.25);
  }
  .cover-front .subtitle {
    font-family: "Playfair Display", Georgia, serif; font-style: italic;
    font-size: clamp(16px, 3.6vw, 22px); color: #e6c15a; margin: 0 0 6px;
  }
  .cover-art { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
  .cover-art svg { width: min(86%, 280px); height: auto; max-height: 100%; }
  .cover-front .for { font-size: clamp(16px, 3.4vw, 20px); font-weight: 700; color: #fff6d4; margin-top: 4px; }
  .cover-front .goldline { width: 70%; height: 2px; background: linear-gradient(90deg, transparent, #e6c15a, transparent); margin: 6px 0; }
  .cover-inside {
    transform: rotateY(180deg);
    width: 100%; height: 100%;
    border-radius: 8px 0 0 8px;
    box-shadow: inset -18px 0 28px -18px rgba(80,40,10,.22);
    padding: 16px 18px 16px 22px;
    background:
      radial-gradient(ellipse at 80% 10%, rgba(255,255,255,.45), transparent 55%),
      repeating-linear-gradient(0deg, rgba(120,70,20,.035) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, #f7ead0, #f0dcb6);
    overflow: auto;
  }
  #book.single .cover-inside { /* hidden as a page; single uses header on the right page */ }

  /* Hidden leftover left page slot used in spread when cover has finished opening:
     the visible left page is the cover inside. We also keep #pageL as that inside. */

  /* Flipping leaf (right page turn) */
  .leaf {
    position: absolute; inset: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    z-index: 12;
    pointer-events: none;
    visibility: hidden;
  }
  .leaf.on { visibility: visible; pointer-events: none; }
  .leaf .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.45), transparent 55%),
      linear-gradient(180deg, #f7ead0, #f0dcb6);
    overflow: hidden;
    border-radius: 0 8px 8px 0;
  }
  .leaf .face.back { transform: rotateY(180deg); border-radius: 8px 0 0 8px; }
  .leaf.flip { transition: transform .9s cubic-bezier(.2,.7,.2,1); transform: rotateY(-180deg); }
  .leaf-shade {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: linear-gradient(90deg, rgba(60,30,10,.18), transparent 24%, transparent 76%, rgba(60,30,10,.08));
  }

  #pageRContent, #pageUnder { position: absolute; inset: 0; }
  #pageUnder { z-index: 1; }
  #pageRContent { z-index: 2; }

  /* ===== Open-button under closed book ===== */
  #openBtn, .btn {
    font-weight: 700; font-size: clamp(22px, 4.5vw, 30px);
    border: 5px solid #fff; border-radius: 24px; padding: 12px 26px;
    color: #fff; background: #7b5cff; box-shadow: 0 7px 0 #4b33b8; margin: 8px 4px; z-index: 5;
  }
  .btn.go, #openBtn { background: #2fd27a; box-shadow: 0 7px 0 #17984f; }
  .btn.blue { background: #3fb5ff; box-shadow: 0 7px 0 #1f86c7; }
  .btn.orange { background: #ff7a3d; box-shadow: 0 7px 0 #c9541d; }
  .btn:active, #openBtn:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  #openRow {
    flex: none; display: flex; flex-direction: column; align-items: center;
    margin-top: 28px; z-index: 5; min-height: 90px;
  }
  #book.open ~ #openRow, #desk.reading #openRow { visibility: hidden; height: 0; min-height: 0; margin: 0; overflow: hidden; }
  .cover-sub { font-size: 18px; font-weight: 600; color: #fff6d4; text-shadow: 0 2px 0 rgba(60,20,20,.4); margin: 6px 0 0; }

  /* ===== Inside typography ===== */
  .chap { font-family: "Playfair Display", Georgia, serif; font-weight: 800; font-size: clamp(26px, 3.2vw, 38px); line-height: 1.05; color: #8c1c2b; margin: 0 0 6px; }
  .chap small { display: block; font-size: .45em; letter-spacing: .12em; text-transform: uppercase; color: #c44914; font-family: Fredoka, sans-serif; font-weight: 700; margin-bottom: 4px; }
  .story { font-size: clamp(16px, 1.7vw, 20px); font-weight: 600; line-height: 1.35; color: #3a2414; margin: 8px 0 12px; }
  .refcard {
    background: #fff8e8; border: 4px solid #e6c15a; border-radius: 18px;
    padding: 8px 8px 10px; text-align: center; box-shadow: 0 4px 0 #c9a24a;
  }
  .refcard .lab { font-size: 15px; font-weight: 700; color: #8c1c2b; }
  .refcard .hinty { font-size: 14px; font-weight: 600; color: #6b4a28; margin-top: 2px; }
  .howto { font-size: 15px; font-weight: 600; color: #6b4a28; margin-top: 12px; line-height: 1.35; }
  .howto li { margin: 4px 0; }

  /* Contents list */
  .toc { display: flex; flex-direction: column; gap: 7px; height: 100%; overflow: auto; padding: 14px 14px 14px 8px; }
  .toc h2 { font-family: "Playfair Display", Georgia, serif; font-size: clamp(28px, 4vw, 42px); color: #8c1c2b; margin: 0 0 4px; text-align: center; }
  .toc .belongs { text-align: center; font-size: 15px; font-weight: 600; color: #6b4a28; margin: 0 0 8px; }
  .ch {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 3px solid #e6c15a; border-radius: 16px; background: #fff8e8;
    padding: 7px 10px; color: #3a2414; box-shadow: 0 3px 0 #e0c48a; width: 100%;
  }
  .ch:active { transform: translateY(2px); box-shadow: 0 1px 0 #e0c48a; }
  .ch .num { font-family: "Playfair Display", Georgia, serif; font-weight: 800; font-size: 22px; color: #c44914; min-width: 28px; }
  .ch .nm { flex: 1; font-weight: 700; font-size: clamp(15px, 2vw, 18px); }
  .ch .st { font-size: 16px; letter-spacing: 1px; }
  .ch.locked { opacity: .55; filter: grayscale(.3); cursor: default; }
  .ch.current { border-color: #2fd27a; box-shadow: 0 3px 0 #17984f; background: #e8fff2; }

  /* Play header + scene */
  .playhead {
    display: flex; align-items: center; gap: 6px; flex: none;
    padding: 6px 8px 6px 10px;
    background: rgba(255,248,232,.92);
    border-bottom: 3px solid #e6c15a;
    min-height: 56px;
  }
  .playhead .ttl { flex: 1; min-width: 0; font-weight: 700; font-size: clamp(14px, 2.4vw, 20px); color: #8c1c2b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tpill { font-weight: 700; font-size: clamp(13px, 2.2vw, 17px); background: #fff; border-radius: 14px; padding: 5px 8px; box-shadow: 0 2px 0 #e0c48a; white-space: nowrap; }
  .tpill.bonus { background: #ffe066; color: #7a4a00; }
  .tpill.bonus.out { background: #eee; color: #888; }
  #hintBtn, #contentsBtn, #zoomFit {
    font-weight: 700; font-size: clamp(14px, 2.2vw, 17px); color: #fff;
    background: #ffb800; border: 3px solid #fff; border-radius: 16px;
    padding: 5px 10px; box-shadow: 0 3px 0 #c98f00; height: 42px; white-space: nowrap;
  }
  #hintBtn:disabled { background: #c9c3d9; box-shadow: 0 3px 0 #9a93ad; }
  #contentsBtn { background: #7b5cff; box-shadow: 0 3px 0 #4b33b8; font-size: 18px; width: 42px; padding: 0; }
  .mini-ref { width: 42px; height: 42px; border-radius: 10px; border: 3px solid #e6c15a; background: #fff8e8; overflow: hidden; flex: none; }
  .mini-ref svg { width: 100%; height: 100%; }

  .scene-wrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; height: 100%; }
  #view { flex: 1; position: relative; overflow: hidden; touch-action: none; cursor: grab; background: #d9f0ff; min-height: 0; }
  #view.drag { cursor: grabbing; }
  #view svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .zoombar { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
  .zbtn { width: 48px; height: 48px; border-radius: 50%; border: 4px solid #fff; background: #7b5cff; color: #fff; font-size: 28px; font-weight: 700; box-shadow: 0 4px 0 #4b33b8; padding: 0; line-height: 1; }
  .zbtn.all { background: #2fd27a; box-shadow: 0 4px 0 #17984f; font-size: 20px; }
  .zbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4b33b8; }

  .fx { position: absolute; pointer-events: none; z-index: 8; }
  .ring { border-radius: 50%; border: 6px solid #ffb800; box-shadow: 0 0 0 4px #fff, 0 0 18px #ffb800; transform: translate(-50%,-50%); animation: ringpulse .8s ease-in-out infinite; }
  @keyframes ringpulse { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 50% { transform: translate(-50%,-50%) scale(1.25); opacity: .6; } }
  .spark { font-size: 30px; transform: translate(-50%,-50%); animation: fly .9s ease-out forwards; }
  @keyframes fly { from { transform: translate(-50%,-50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity: 0; } }
  .miss { width: 40px; height: 40px; border-radius: 50%; border: 4px solid rgba(255,255,255,.9); transform: translate(-50%,-50%); animation: missa .45s ease-out forwards; }
  @keyframes missa { from { transform: translate(-50%,-50%) scale(.3); opacity: 1; } to { transform: translate(-50%,-50%) scale(1.4); opacity: 0; } }
  #toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #fff; color: #8c1c2b; font-weight: 700; font-size: clamp(16px, 3.4vw, 22px); border-radius: 18px; padding: 8px 14px; box-shadow: 0 4px 0 #e0c48a; z-index: 9; pointer-events: none; opacity: 0; transition: opacity .25s; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; }

  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-5px) rotate(2deg); }
  }
  g.bob { animation: bob 2.4s ease-in-out infinite; }

  /* Win plate */
  .overlay { position: fixed; inset: 0; background: rgba(58,42,93,.45); display: none; align-items: center; justify-content: center; z-index: 90; padding: 16px; }
  .overlay.on { display: flex; }
  .box { background: #fffdf6; border: 6px solid #e6c15a; border-radius: 30px; padding: 20px 18px; text-align: center; max-width: 520px; width: 100%; max-height: 96vh; overflow-y: auto; animation: pop .35s ease-out; box-shadow: 0 18px 40px rgba(40,20,70,.35); position: relative; z-index: 1; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .box h1 { font-family: "Playfair Display", Georgia, serif; font-size: clamp(30px, 7vw, 48px); margin: 6px 0 10px; color: #8c1c2b; line-height: 1.05; }
  .box p { font-size: clamp(18px, 4vw, 24px); margin: 8px 0; font-weight: 600; }
  .stars { font-size: clamp(40px, 10vw, 64px); letter-spacing: 6px; line-height: 1.1; margin: 4px 0 8px; }
  .stars .dim { opacity: .25; filter: grayscale(1); }
  .bigtime { font-size: clamp(30px, 8vw, 48px); font-weight: 700; color: #c44914; margin: 4px 0; }

  /* Reduced motion: no 3D, simple fade/slide */
  .leaf.slide-out { transition: transform .35s ease, opacity .35s ease; transform: translateX(-28%) ; opacity: 0; }
  #book.reduce .cover { transition: opacity .4s ease, transform .4s ease; }
  #book.reduce.open .cover { transform: none; opacity: 0; }
  #book.reduce { transition: width .4s ease, height .4s ease; }

  @media (prefers-reduced-motion: reduce) {
    g.bob { animation: none; }
    .cover, #book, .leaf { transition-duration: .01s !important; }
    .box { animation: none; }
  }
  @media (max-width: 420px) {
    .roundbtn { width: 44px; height: 44px; font-size: 22px; }
    .pill { font-size: 16px; padding: 6px 10px; }
    .zbtn { width: 44px; height: 44px; font-size: 24px; }
    .playhead { gap: 4px; padding: 5px 6px; }
    #hintBtn { height: 38px; padding: 4px 8px; }
  }

  .spread { display: block; }
  .spine {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 16px;
    transform: translateX(-50%); z-index: 6; flex: none; height: auto;
  }
  .page.right {
    position: absolute; left: 50%; top: 0; right: 0; bottom: 0;
    width: auto; height: auto;
  }
  #book.open .cover, #book.opened .cover { z-index: 5; }
  #book.opened .cover { pointer-events: auto; }
  #book.single.open .page.right { left: 12px; right: 0; width: auto; border-radius: 0 8px 8px 0; }
  #book.single.open .spine { left: 0; width: 12px; transform: none; }
  #book.single.opened .cover { opacity: 0; pointer-events: none; z-index: 1; }
  #book.single .cover-inside { display: none; }
  #pageRContent, #pageUnder { position: absolute; inset: 0; overflow: hidden; }
  .scene-wrap { height: 100%; width: 100%; }
  #pageL { -webkit-overflow-scrolling: touch; }

  /* 3d-flip-fix */
  #book, #book .spread, #book .page.right, #book .leaf, #book .cover {
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }
  #book .page.right { overflow: visible; }
  #pageRContent, #pageUnder, .scene-wrap, #view { overflow: hidden; border-radius: 0 0 8px 0; }
  .leaf .zoombar { display: none !important; }
  .leaf .face.front::after, .leaf .face.back::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: linear-gradient(90deg, rgba(40,20,10,.2), transparent 18%, transparent 80%, rgba(40,20,10,.12));
  }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="desk">
  <span class="wall-leaf" style="left:4%;top:18%">🍁</span>
  <span class="wall-leaf" style="right:6%;top:22%;font-size:28px">🍂</span>
  <span class="wall-leaf" style="left:8%;bottom:10%;font-size:30px">🍁</span>
  <span class="wall-leaf" style="right:10%;bottom:14%">🍂</span>
  <span class="wall-leaf" style="left:16%;top:8%;font-size:22px;opacity:.5">🍃</span>
  <span class="wall-leaf" style="right:18%;top:10%;font-size:22px;opacity:.5">🍁</span>

  <div class="topline">
    <a class="pill" href="../">🏠 Kai's Kool Kwiz</a>
    <button class="roundbtn" id="muteBtn" aria-label="Sound on or off">🔊</button>
  </div>

  <div id="bookStage">
    <div id="book" class="closed">
      <div class="book-shadow"></div>
      <div class="page-edge right-edge"></div>

function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(f, t0, dur, type, vol, f2) {
  const a = ac(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, a.currentTime + t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + t0 + dur);
  g.gain.setValueAtTime(0.0001, a.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, a.currentTime + t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.05);
}
function paperSound() {
  const a = ac(); if (!a || muted) return;
  const len = 0.32, n = Math.floor(a.sampleRate * len);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) {
    const t = i / n;
    const env = Math.pow(Math.sin(Math.PI * t), 0.7) * (0.35 + 0.65 * Math.random());
    d[i] = (Math.random() * 2 - 1) * env * (t < 0.15 ? 1 : 0.7);
  }
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1600 + Math.random() * 600; f.Q.value = 0.65;
  const g = a.createGain(); g.gain.value = 0.45;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}

  };
  const p = PALS[palName] || PALS.real;
  let tail = "";
  const tails = p.tail;
  const angles = [-70, -45, -22, 0, 22, 45, 68];
  for (let i = 0; i < angles.length; i++) {
    const col = tails[i % tails.length];

  }
  const wing = el(8, 6, 22, 14, p.wing, 'stroke="' + p.dark + '" stroke-width="1.2"');
  const body = el(0, 8, 28, 24, p.body, 'stroke="' + p.dark + '" stroke-width="1.5"') +

  const legs = '<g stroke="#c9a024" stroke-width="3" fill="none" stroke-linecap="round"><path d="M-8 28 L-10 40 L-16 42"/><path d="M8 28 L10 40 L16 42"/></g>';
  let head = el(26, -10, 14, 13, p.head, 'stroke="' + p.dark + '" stroke-width="1.2"');
  if (kind !== "back") {
    head += el(32, -13, 3.2, 3.4, "#fff") + el(33, -13, 1.6, 1.8, "#1a1a1a");
    head += path("M38 -10 L48 -7 L38 -4 Z", p.beak, 'stroke="#c9a024" stroke-width="0.8"');
  } else {
    head = el(-26, -10, 14, 13, p.head, 'stroke="' + p.dark + '" stroke-width="1.2"');
  }
  let wattle = "";
  if (kind !== "back" && kind !== "nowattle") {
    wattle = el(34, -2, 4, 8, "#e53935") + el(28, -16, 3.5, 6, "#e53935");
  }
  let scarf = "";
  if (kind === "real") {
    scarf = path("M16 0 Q26 10 22 18 Q18 8 12 4 Z", "#3b6fd6", 'stroke="#234a9a" stroke-width="1"') +
      rec(12, -2, 22, 7, "#3b6fd6", 'stroke="#234a9a" stroke-width="1"', 3);
  }
  let hat = "";
  if (kind === "real" || kind === "white") {
    hat = rec(16, -36, 28, 14, "#1a1a1a", "", 2) +
      rec(10, -24, 40, 6, "#1a1a1a", "", 2) +
      rec(26, -31, 10, 7, "#f1c40f", 'stroke="#c9a024" stroke-width="0.8"', 1);
  } else if (kind === "chef") {
    hat = el(26, -38, 16, 14, "#fff") + rec(14, -30, 24, 10, "#fff", 'stroke="#ddd" stroke-width="0.8"', 2);
  } else if (kind === "bluehat") {
    hat = path("M14 -22 L28 -48 L42 -22 Z", "#3b6fd6", 'stroke="#234a9a" stroke-width="1.2"') +
      el(28, -48, 5, 5, "#ff4fa3");
  }
  const bob = opt.bob ? ' class="bob"' : "";
  const flip = opt.flip ? -1 : 1;
  const s = opt.scale || 1;
  const id = opt.id ? ' id="' + opt.id + '"' : "";
  const cls = opt.cls ? ' class="' + opt.cls + '"' : "";
  return '<g' + id + cls + ' data-kind="' + kind + '" transform="translate(' + (opt.x || 0) + ' ' + (opt.y || 0) + ') scale(' + (s * flip) + ',' + s + ')"><g' + bob + '>' +
    tail + legs + body + wing + scarf + head + wattle + hat +
    "</g></g>";
}

function starRating(lv, timeMs, hints, bonusHit) {
  let s = 3;
  if (hints >= 1) s--;
  if (hints >= 2) s--;
  if (timeMs > lv.timeLimit && !bonusHit) s--;
  if (s < 1) s = 1;
  return s;
}

function scatterEmoji(R, chars, n, reg, smin, smax, avoid) {
  let o = "";
  avoid = avoid || [];
  for (let i = 0; i < n; i++) {
    let x, y, ok, tries = 0;
    do {
      x = reg[0] + R() * reg[2];
      y = reg[1] + R() * reg[3];
      ok = true;
      for (let a = 0; a < avoid.length; a++) {
        if (Math.hypot(x - avoid[a].x, y - avoid[a].y) < (avoid[a].r || 80)) { ok = false; break; }
      }
    } while (!ok && ++tries < 20);
    const ch = chars[Math.floor(R() * chars.length)];
    const s = smin + R() * (smax - smin);
    const rot = (R() * 50) - 25;
    o += em(ch, x, y, s, rot);
  }
  return o;
}

function buildOccluder(lv, T) {
  const o = lv.occlude || 0;
  if (o <= 0) return "";
  const s = T.scale;
  /* Draw a prop overlapping the turkey from the bottom or side, leaving the hat mostly visible. */
  if (lv.n === 4) return rec(T.x - 40, T.y + 10, 100, 50, "#8a5a2b", "", 6);
  if (lv.n === 5) return hay(T.x + 10, T.y + 28, 1.1 + s, -8);
  if (lv.n === 6) return pumpkin(T.x + 18, T.y + 22, 0.9, "#ef7a1a");
  if (lv.n === 7) return rec(T.x - 30, T.y + 16, 90, 46, "#ff7a3d", "", 10) + em("🥁", T.x + 20, T.y + 20, 36);
  if (lv.n === 8) return rec(T.x - 50, T.y - 10, 36, 220, "#6b3f1a") + el(T.x - 32, T.y - 80, 50, 44, "#c44914");
  if (lv.n === 9) return pie(T.x + 6, T.y + 18, 1.35);
  if (lv.n === 10) return rec(T.x - 36, T.y + 8, 80, 40, "#7b5cff", "", 8) + em("🎪", T.x + 8, T.y - 40, 48);
  return pumpkin(T.x + 16, T.y + 24, 1, "#ef7a1a");
}

function buildScene(lv) {
  const R = rng(lv.seed);
  const T = lv.turkey;
  const avoid = [{ x: T.x, y: T.y, r: 90 * T.scale + 40 }];
  (lv.decoys || []).forEach(function (d) { avoid.push({ x: d.x, y: d.y, r: 70 }); });
  let mid = "", front = "", birds = "";

  if (lv.n === 1) {
    mid += em("🧺", 760, 500, 64) + em("🌽", 820, 500, 50) + em("🍎", 900, 500, 36) + em("🥖", 780, 580, 48);
    mid += pumpkin(400, 560, 1.1) + pumpkin(460, 580, 0.8, "#f0a030");
    mid += scatterEmoji(R, ["🍁","🍂","🌼","🍃"], lv.clutter, [40, 440, 1100, 300], 22, 40, avoid);
  } else if (lv.n === 2) {
    for (let r = 0; r < 4; r++) {

        const x = 80 + c * 110 + (r % 2) * 30 + (R() * 16 - 8);
        const y = 430 + r * 80 + (R() * 12 - 6);
        if (Math.hypot(x - T.x, y - T.y) < 70) continue;
        mid += pumpkin(x, y, 0.7 + R() * 0.45, R() > 0.3 ? "#ef7a1a" : "#f0a030");
      }
    }
    mid += em("🌾", 600, 400, 70) + em("🌽", 540, 420, 48);
    mid += scatterEmoji(R, ["🍁","🍂"], 18, [20, 360, 1160, 400], 20, 36, avoid);

/* ================= Page flip ================= */
function snapshotNode(el) {
  return el ? el.innerHTML : "";
}
function flipTo(prepare, done) {
  if (flipping) return;
  flipping = true;
  const leaf = $("leaf"), front = $("leafFront"), back = $("leafBack");
  const content = $("pageRContent");
  const oldHtml = snapshotNode(content);
  if (reduce) {
    prepare();
    flipping = false;
    if (done) done();
    return;
  }
  front.innerHTML = '<div style="position:absolute;inset:0;overflow:hidden">' + oldHtml + '</div><div class="leaf-shade"></div>';
  prepare();
  const newHtml = snapshotNode(content);
  back.innerHTML = '<div style="position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#f7ead0,#f0dcb6)">' +
    (isSingle() ? "" : snapshotNode($("pageL"))) +
    '</div><div class="leaf-shade"></div>';
  leaf.classList.add("on");
  leaf.classList.remove("flip");
  leaf.style.transition = "none";
  leaf.style.transform = "rotateY(0deg)";
  void leaf.offsetWidth;
  paperSound();
  requestAnimationFrame(function () {
    leaf.style.transition = "transform .9s cubic-bezier(.2,.7,.2,1)";
    leaf.classList.add("flip");
    leaf.style.transform = "rotateY(-180deg)";
  });
  setTimeout(function () {
    leaf.classList.remove("on", "flip");
    leaf.style.transition = "";
    leaf.style.transform = "";
    front.innerHTML = ""; back.innerHTML = "";
    flipping = false;
    if (done) done();
  }, 950);
}

function setFlipProgress(p) {
  const leaf = $("leaf");
  p = Math.max(0, Math.min(1, p));
  leaf.classList.add("on");
  leaf.classList.remove("flip");
  leaf.style.transition = "none";
  leaf.style.transform = "rotateY(" + (-180 * p) + "deg)";
}

/* ================= Play / camera ================= */
function measure() {
  const view = $("view"); if (!view) return;
  const b = view.getBoundingClientRect();
  VW = Math.max(1, b.width); VH = Math.max(1, b.height);
  minS = Math.min(VW / SW, VH / SH) * 0.995;
}
function clampV() {
  const maxS = 6;
  V.s = Math.max(minS, Math.min(maxS, V.s));
  const vw = VW / V.s, vh = VH / V.s, px = vw * 0.28, py = vh * 0.28;
  const lox = Math.min(SW / 2, vw / 2 - px), hix = Math.max(SW / 2, SW - vw / 2 + px);
  const loy = Math.min(SH / 2, vh / 2 - py), hiy = Math.max(SH / 2, SH - vh / 2 + py);
  V.cx = vw >= SW ? SW / 2 : Math.max(lox, Math.min(hix, V.cx));
  V.cy = vh >= SH ? SH / 2 : Math.max(loy, Math.min(hiy, V.cy));
}
function renderView() {
  const svg = document.getElementById("sceneSvg"); if (!svg) return;
  clampV();
  const vw = VW / V.s, vh = VH / V.s;
  svg.setAttribute("viewBox", (V.cx - vw / 2) + " " + (V.cy - vh / 2) + " " + vw + " " + vh);
  if (fxRing) placeRing();
}
function toScreen(wx, wy) { return { x: (wx - V.cx) * V.s + VW / 2, y: (wy - V.cy) * V.s + VH / 2 }; }
function toWorld(sx, sy) { return { x: (sx - VW / 2) / V.s + V.cx, y: (sy - VH / 2) / V.s + V.cy }; }
function zoomAt(sx, sy, f) {
  const w = toWorld(sx, sy);
  V.s = Math.max(minS, Math.min(6, V.s * f));
  V.cx = w.x - (sx - VW / 2) / V.s;
  V.cy = w.y - (sy - VH / 2) / V.s;
  renderView();
}
function stopAnim() { if (anim) { cancelAnimationFrame(anim.raf); anim = null; } }
function animateTo(T, dur, done) {
  stopAnim();
  const A = { cx: V.cx, cy: V.cy, s: V.s }, t0 = performance.now();
  anim = { raf: 0 };
  const step = function (now) {
    let t = Math.min(1, (now - t0) / dur);
    const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const s = Math.exp(Math.log(A.s) * (1 - e) + Math.log(T.s) * e);
    const p0 = { x: (T.cx - A.cx) * A.s, y: (T.cy - A.cy) * A.s };
    V.s = s; V.cx = T.cx - p0.x * (1 - e) / s; V.cy = T.cy - p0.y * (1 - e) / s;
    renderView();
    if (t < 1) anim.raf = requestAnimationFrame(step); else { anim = null; if (done) done(); }
  };
  anim.raf = requestAnimationFrame(step);
}
function zoomSmooth(f) { animateTo({ cx: V.cx, cy: V.cy, s: Math.max(minS, Math.min(6, V.s * f)) }, 280); }
function fitAll(animated) {
  const T = { cx: SW / 2, cy: SH / 2, s: minS };
  if (animated && !reduce) animateTo(T, 500); else { stopAnim(); V = T; renderView(); }
}

const ptrs = new Map();
let gesture = null, viewBound = false;
function localPt(e, view) { const b = view.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
function bindViewPointers() {
  if (viewBound) return;
  viewBound = true;
  const root = $("pageR");
  root.addEventListener("pointerdown", onPd);
  root.addEventListener("pointermove", onPm);
  root.addEventListener("pointerup", onPu);
  root.addEventListener("pointercancel", onPu);
  root.addEventListener("wheel", onWheel, { passive: false });
}
function onPd(e) {
  const view = $("view"); if (!view || !e.target.closest("#view") || e.target.closest(".zoombar")) return;
  if (!st || st.finished) return;
  ac(); stopAnim();
  try { view.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, localPt(e, view));
  if (ptrs.size === 1) { const q = localPt(e, view); gesture = { type: "drag", sx: q.x, sy: q.y, lx: q.x, ly: q.y, t: performance.now(), moved: 0 }; }
  else if (ptrs.size === 2) { const a = [...ptrs.values()]; gesture = { type: "pinch", d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), mx: (a[0].x + a[1].x) / 2, my: (a[0].y + a[1].y) / 2 }; }
}
function onPm(e) {
  const view = $("view"); if (!view || !ptrs.has(e.pointerId) || !gesture) return;
  const q = localPt(e, view); ptrs.set(e.pointerId, q);
  if (gesture.type === "drag" && ptrs.size === 1) {
    const dx = q.x - gesture.lx, dy = q.y - gesture.ly; gesture.lx = q.x; gesture.ly = q.y;
    gesture.moved = Math.max(gesture.moved, Math.hypot(q.x - gesture.sx, q.y - gesture.sy));
    if (gesture.moved > 8) { view.classList.add("drag"); V.cx -= dx / V.s; V.cy -= dy / V.s; renderView(); }
  } else if (gesture.type === "pinch" && ptrs.size >= 2) {
    const a = [...ptrs.values()];
    const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), mx = (a[0].x + a[1].x) / 2, my = (a[0].y + a[1].y) / 2;
    V.cx -= (mx - gesture.mx) / V.s; V.cy -= (my - gesture.my) / V.s;
    if (gesture.d > 10) zoomAt(mx, my, d / gesture.d); else renderView();
    gesture.d = d; gesture.mx = mx; gesture.my = my;
  }
}
function onPu(e) {
  const view = $("view"); if (!view || !ptrs.has(e.pointerId)) return;
  const q = localPt(e, view); ptrs.delete(e.pointerId);
  if (gesture && gesture.type === "drag" && ptrs.size === 0 && gesture.moved <= 10 && performance.now() - gesture.t < 700 && e.type === "pointerup") tapAt(q.x, q.y);
  if (ptrs.size === 1) { const a = [...ptrs.values()][0]; gesture = { type: "drag", sx: a.x, sy: a.y, lx: a.x, ly: a.y, t: 0, moved: 99 }; }
  else if (ptrs.size === 0) { gesture = null; view.classList.remove("drag"); }
}
function onWheel(e) {
  if (!$("view") || !st || st.finished || !e.target.closest("#view")) return;
  e.preventDefault(); stopAnim();
  const q = localPt(e, $("view"));
  const dy = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
  zoomAt(q.x, q.y, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0018)));
}
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

function toast(t, ms) {
  const e = $("toast"); if (!e) return;
  e.textContent = t; e.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(function () { e.classList.remove("show"); }, ms || 1800);
}

function hitTurkey(sx, sy) {
  if (!st) return false;
  const half = st.turkey.size / 2 * V.s;
  if (half < 6) return false;
  const q = toScreen(st.turkey.x, st.turkey.y);
  const hr = Math.max(half * 1.15, 28);
  return Math.hypot(q.x - sx, q.y - sy) <= hr;
}
function hitDecoy(sx, sy) {
  if (!st) return false;
  const lv = LEVELS[st.n - 1];
  for (let i = 0; i < (lv.decoys || []).length; i++) {
    const d = lv.decoys[i];
    const size = turkeyHitSize(d.scale);
    const half = size / 2 * V.s;
    if (half < 6) continue;
    const q = toScreen(d.x, d.y);
    const hr = Math.max(half * 1.1, 24);
    if (Math.hypot(q.x - sx, q.y - sy) <= hr) return d;
  }
  return null;
}
function tapAt(sx, sy) {
  if (!st || st.finished || flipping) return;
  if (hitTurkey(sx, sy)) { foundTurkey(); return; }
  const d = hitDecoy(sx, sy);
  SFX.miss();
  fx("miss", sx, sy);
  if (d) {
    const msg = d.kind === "nohat" || d.kind === "back" ? "No hat! That's not him." :
      d.kind === "chef" ? "That's a chef, not our turkey!" :
      d.kind === "white" ? "Wrong colours! Look for the blue scarf." :
      d.kind === "bluehat" ? "Wrong hat! He has a black hat." :
      "That's not him!";
    toast(msg, 1600);
  }
}

function fx(kind, x, y, ch, dx, dy) {
  const view = $("view"); if (!view) return;
  const d = document.createElement("div"); d.className = "fx " + kind; d.style.left = x + "px"; d.style.top = y + "px";
  if (ch) d.textContent = ch;
  if (dx !== undefined) { d.style.setProperty("--dx", dx + "px"); d.style.setProperty("--dy", dy + "px"); }
  view.appendChild(d); setTimeout(function () { d.remove(); }, 1000);
}
function clearFx() { if (fxRing) { fxRing.el.remove(); clearTimeout(fxRing.t); fxRing = null; } }
function placeRing() {
  if (!fxRing || !st) return;
  const q = toScreen(st.turkey.x, st.turkey.y);
  const d = Math.max(80, st.turkey.size * V.s * 1.8);
  Object.assign(fxRing.el.style, { left: q.x + "px", top: q.y + "px", width: d + "px", height: d + "px" });
}

function useHint() {
  if (!st || st.finished || st.hints <= 0) return;
  st.hints--;
  updateHint();
  SFX.hint();
  say("Look here!");
  clearFx();
  const view = $("view"); if (!view) return;
  const ring = document.createElement("div"); ring.className = "fx ring"; view.appendChild(ring);
  fxRing = { el: ring, t: setTimeout(clearFx, 4500) };
  const targetS = Math.max(minS, Math.min(6, 90 / st.turkey.size));
  animateTo({ cx: st.turkey.x, cy: st.turkey.y, s: targetS }, 900);
}

function updateHint() {
  const b = $("hintBtn"); if (b) { b.textContent = "💡 " + st.hints; b.disabled = st.hints <= 0 || !!(st && st.finished); }
}
function updateTimer() {
  if (!st || !st.t0 || st.finished) return;
  const t = $("timer"); if (t) t.textContent = "⏱ " + fmt(Date.now() - st.t0);
  if (st.bonus && $("bonusPill")) {
    const left = Math.max(0, st.bonus - (Date.now() - st.t0) / 1000);
    const p = $("bonusPill");
    p.textContent = left > 0 ? "⭐ " + Math.ceil(left) + "s" : "⭐ —";
    p.classList.toggle("out", left <= 0);
  }
}
function clearTimers() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  stopAnim(); clearFx();
  gameGen += 1;
}

function startLevel(n, doFlip) {
  const lv = LEVELS[n - 1]; if (!lv) return;
  gameGen += 1;
  clearTimeout(showWin.t);
  $("winBox").classList.remove("on");
  $("endBox").classList.remove("on");
  const go = function () {
    const built = buildScene(lv);
    if (!isSingle()) $("pageL").innerHTML = leftForLevel(lv);
    $("pageRContent").innerHTML = playPageHtml(lv, built.svg);
    bindPlayControls();
    st = {
      n: n, t0: Date.now(), hints: 2, finished: false,

    };

    measure();
    V = { cx: SW / 2, cy: SH / 2, s: minS };
    const view = $("view");

    updateTimer();

    say("Find the turkey, Kai Lee! He is wearing a black hat.");
  };

}

function foundTurkey() {
  if (!st || st.finished) return;
  st.finished = true;
  const time = Math.max(0, Date.now() - st.t0);
  st.time = time;
  if (st.bonus && time <= st.bonus * 1000) st.bonusHit = true;
  const lv = LEVELS[st.n - 1];
  const stars = starRating(lv, time, 2 - st.hints, st.bonusHit);
  st.stars = stars;
  const idx = st.n - 1;
  if (stars > (save.stars[idx] || 0)) save.stars[idx] = stars;
  if (save.bestTime[idx] == null || time < save.bestTime[idx]) save.bestTime[idx] = time;
  if (save.unlocked < 10 && st.n >= save.unlocked) save.unlocked = Math.min(10, st.n + 1);
  persist();

  const q = toScreen(st.turkey.x, st.turkey.y);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2, d = 50 + Math.random() * 40;
    fx("spark", q.x, q.y, ["✨","⭐","🍁","💛"][i % 4], Math.cos(a) * d, Math.sin(a) * d);
  }
  const hero = document.getElementById("turkey-real");
  if (hero) {
    const halo = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    halo.setAttribute("cx", "0"); halo.setAttribute("cy", "0"); halo.setAttribute("r", "55");
    halo.setAttribute("fill", "rgba(47,210,122,.22)");
    halo.setAttribute("stroke", "#2fd27a"); halo.setAttribute("stroke-width", "5");
    hero.insertBefore(halo, hero.firstChild);
  }
  SFX.found();
  if (st.bonusHit) SFX.bonus();
  const gen = gameGen;
  clearTimeout(showWin.t);
  showWin.t = setTimeout(function () {
    if (gameGen !== gen || !st || !st.finished) return;
    showWin();
  }, 700);
}

function showWin() {
  if (!st) return;
  const stars = st.stars;
  let html = "";
  for (let i = 1; i <= 3; i++) html += i <= stars ? "⭐" : '<span class="dim">⭐</span>';
  $("winStars").innerHTML = html;
  $("winStars").setAttribute("aria-label", stars + " star" + (stars === 1 ? "" : "s"));
  $("winTime").textContent = "⏱ " + fmt(st.time || 0);
  const msgs = { 3: "Super spotting!", 2: "Great finding!", 1: "You found him!" };
  $("winSub").textContent = msgs[stars] || msgs[1];
  $("winBonus").textContent = st.bonusHit ? "⭐ Bonus time! You were super speedy!" : "";
  const best = save.bestTime[st.n - 1];
  $("winBest").textContent = best === st.time ? "🏆 New best time!" : ("Best: ⏱ " + fmt(best));
  $("winNext").style.display = st.n < 10 ? "" : "none";
  $("winBox").classList.add("on");
  SFX.win();
  say("You did it, Kai Lee!");
  confetti();
}

function showEnd() {
  $("winBox").classList.remove("on");
  const total = save.stars.reduce(function (a, b) { return a + b; }, 0);
  let html = "";
  const avg = Math.round(total / 10);
  for (let i = 1; i <= 3; i++) html += i <= Math.max(1, Math.min(3, Math.ceil(total / 10))) ? "⭐" : '<span class="dim">⭐</span>';
  $("endStars").innerHTML = html;
  $("endTotal").textContent = "You earned " + total + " out of 30 stars!";
  $("endBox").classList.add("on");
  SFX.win(); confetti();
  say("You found every turkey, Kai Lee!");
}

function goContents(doFlip) {
  $("winBox").classList.remove("on");
  $("endBox").classList.remove("on");
  clearTimers();
  st = null;
  const go = function () { renderContents(); };
  if (doFlip && book.classList.contains("open") && !reduce) flipTo(go); else go();
}

/* ================= Confetti ================= */
function confetti() {
  const cv = $("confetti"), x = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#c44914","#e6c15a","#7b5cff","#2fd27a","#ff7a3d","#fff","#3fb5ff"];
  const P = [];
  for (let i = 0; i < 110; i++) P.push({ x: Math.random()*cv.width, y: -20 - Math.random()*cv.height*0.3, vx: Math.random()*6-3, vy: 3+Math.random()*4, a: Math.random()*6, r: 6+Math.random()*7, c: cols[i%cols.length] });
  const run = ++confetti.run; let n = 0;
  (function f() {
    if (run !== confetti.run) { x.clearRect(0, 0, cv.width, cv.height); return; }
    x.clearRect(0, 0, cv.width, cv.height);
    for (let i = 0; i < P.length; i++) { const q = P[i]; q.x += q.vx; q.y += q.vy; q.a += .1; x.fillStyle = q.c; x.save(); x.translate(q.x, q.y); x.rotate(q.a); x.fillRect(-q.r, -q.r / 2, q.r * 2, q.r); x.restore(); }
    if (++n < 200) requestAnimationFrame(f); else x.clearRect(0, 0, cv.width, cv.height);
  })();
}
confetti.run = 0;

}
